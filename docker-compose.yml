# Local development stack. The API hot-reloads from the mounted source and waits
# for Postgres to be genuinely ready (healthcheck) before starting.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` returns success only once Postgres accepts connections.
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      target: runtime
    # Dev override of the image CMD: migrate, then run uvicorn with reload.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      ENVIRONMENT: dev
      DEBUG: "true"
      DATABASE_URL: postgresql+asyncpg://portfolio:portfolio@db:5432/portfolio
      CORS_ORIGINS: "http://localhost:3000,http://localhost:5173"
      ADMIN_TOKEN: dev-admin-token
      TRUST_PROXY: "false"
    ports:
      - "8000:8000"
    volumes:
      # Mount source for hot reload (the baked-in venv is used as-is).
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
